# Bounded json-file logging for every service (M9): Docker's default driver is unbounded, so a chatty
# container can fill the disk and take the whole stack down. 10m × 5 files caps each service at ~50 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory + noeviction (L9): cap growth so Redis can't OOM the host, but NEVER evict — it backs
    # Hangfire job state (with AOF), so silently dropping keys would lose queued/scheduled jobs. Tune
    # --maxmemory to ~25-50% of the VPS RAM. A full store rejects writes (visible) rather than losing data.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    logging: *default-logging
    # Give .NET's graceful shutdown room to finish in-flight requests / a send batch before SIGKILL (M10).
    # Docker's default is 10s (< the 30s host shutdown), so a redeploy mid-batch would hard-kill in-flight
    # Meta calls and leave inconsistent state (re-run via at-least-once). 30s matches the host timeout.
    stop_grace_period: 30s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      REDIS_CONNECTION: "redis:6379,abortConnect=false"
    depends_on:
      redis:
        condition: service_healthy
    # Liveness probe: /health/live runs no dependency checks, so it only fails when the
    # process itself is wedged (deadlock, thread-pool exhaustion) — not on a transient DB blip.
    # start_period gives the app room to boot + run EF migrations before failures count.
    # NOTE: the healthcheck only *marks* the container unhealthy; the autoheal sidecar below
    # is what actually restarts it (plain Compose won't restart on health status alone).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Watches every container that defines a healthcheck and restarts any that goes unhealthy.
  # This closes the "hung but alive" gap that restart:unless-stopped alone cannot cover.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: all   # monitor all containers that have a healthcheck
      AUTOHEAL_INTERVAL: 10           # seconds between checks
      AUTOHEAL_START_PERIOD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Wait for the api to pass its healthcheck, not merely start (M18): a plain start-gate lets Caddy come up
    # while the app is still booting/migrating and serve brief 502s. service_healthy holds Caddy until /health
    # succeeds. autoheal (above) covers the runtime "hung but alive" case.
    depends_on:
      api:
        condition: service_healthy

  # Real-time server-load dashboard (CPU / RAM / disk / network + per-container metrics).
  # Bound to 127.0.0.1 only — Netdata ships with NO auth, so it is NOT exposed publicly.
  # Reach it via an SSH tunnel:  ssh -L 19999:localhost:19999 <user>@<vps>  →  http://localhost:19999
  # The /proc, /sys and docker.sock mounts let it read host + container metrics from the bridge network.
  netdata:
    image: netdata/netdata:stable
    hostname: wa-api-vps
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  netdata-config:
  netdata-lib:
  netdata-cache:
